<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵工发放模版转换工具</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242836;
    --border: #2e3346; --text: #e4e6ef; --text2: #8b8fa8;
    --accent: #6c5ce7; --accent2: #a29bfe;
    --green: #00b894; --red: #fd7272; --orange: #fdcb6e; --blue: #74b9ff;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-size: 28px; font-weight: 700; margin-bottom: 6px;
    background: linear-gradient(135deg, var(--accent2), var(--blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--text2); font-size: 14px; margin-bottom: 28px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
  }
  .card-title {
    font-size: 16px; font-weight: 600; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title .icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .upload-area {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 40px 24px; text-align: center; cursor: pointer;
    transition: all 0.2s; position: relative;
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: var(--accent); background: rgba(108,92,231,0.06);
  }
  .upload-area .icon { font-size: 40px; margin-bottom: 12px; }
  .upload-area .title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .upload-area .desc { font-size: 13px; color: var(--text2); }
  .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .btn {
    padding: 10px 24px; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer; border: none; transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-green { background: var(--green); color: #fff; }
  .btn-green:hover { opacity: 0.9; }
  .btn-sm { padding: 6px 14px; font-size: 12px; }
  .btn-row { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .mapping-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px; margin-bottom: 16px;
  }
  .mapping-col {
    padding: 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface2); transition: all 0.2s;
  }
  .mapping-col.selected { border-color: var(--accent); background: rgba(108,92,231,0.08); }
  .col-idx { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .col-header { font-size: 13px; font-weight: 600; margin-bottom: 8px; word-break: break-all; }
  .mapping-col select {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; color: var(--text); font-size: 12px; outline: none;
  }
  .col-sample { margin-top: 6px; font-size: 11px; color: var(--text2); }
  .col-sample span {
    display: inline-block; background: var(--surface); padding: 2px 6px;
    border-radius: 4px; margin: 2px 2px 0 0; max-width: 180px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .badge {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    background: rgba(108,92,231,0.15); color: var(--accent2); font-weight: 600;
  }
  .result-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .result-table th {
    background: var(--surface2); padding: 10px 12px; text-align: left;
    font-weight: 600; font-size: 12px; color: var(--text2);
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .result-table td {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .result-table tr:hover td { background: rgba(108,92,231,0.04); }
  .template-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px; margin-bottom: 16px;
  }
  .template-card {
    padding: 16px; border: 2px solid var(--border); border-radius: var(--radius);
    background: var(--surface2); cursor: pointer; transition: all 0.2s;
  }
  .template-card:hover { border-color: var(--accent); }
  .template-card.selected { border-color: var(--accent); background: rgba(108,92,231,0.1); }
  .template-card .name { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .template-card .fields { font-size: 12px; color: var(--text2); line-height: 1.6; }
  .accum-bar {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px; font-size: 13px;
    color: var(--text2); margin-bottom: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .hidden { display: none !important; }
  .status-msg { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .status-msg.success { background: rgba(0,184,148,0.12); color: var(--green); }
  .status-msg.error { background: rgba(253,114,114,0.12); color: var(--red); }
  .status-msg.info { background: rgba(116,185,255,0.12); color: var(--blue); }
  .custom-fields { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .custom-field-tag {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font-size: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .custom-field-tag .remove { cursor: pointer; color: var(--red); font-size: 14px; line-height: 1; }
  .custom-field-input {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; color: var(--text);
    font-size: 13px; outline: none; width: 200px;
  }
  .custom-field-input:focus { border-color: var(--accent); }
  @media (max-width: 640px) {
    body { padding: 12px; }
    h1 { font-size: 22px; }
    .mapping-grid { grid-template-columns: 1fr 1fr; }
    .template-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🔄 灵工发放模版转换工具</h1>
  <p class="subtitle">上传样例文件，智能识别数据列，一键转换为不同平台的导入模版</p>

  <div class="card" id="step-upload">
    <div class="card-title">
      <span class="icon" style="background:rgba(108,92,231,0.15);">📁</span>
      第一步：上传样例文件
    </div>
    <div class="upload-area" id="upload-area">
      <input type="file" id="file-input" accept=".csv,.xlsx,.xls" multiple onchange="handleFileInput(event)">
      <div class="icon">📤</div>
      <div class="title">点击或拖拽上传 CSV / Excel 文件</div>
      <div class="desc">
        支持同时上传多个文件，系统会智能识别数据表<br>
        <em>支持 CSV（UTF-8 / GBK）和 Excel（.xlsx / .xls）格式</em>
      </div>
    </div>
    <div id="accum-indicator" class="hidden" style="margin-top:12px;"></div>
  </div>

  <div class="card hidden" id="step-mapping">
    <div class="card-title">
      <span class="icon" style="background:rgba(116,185,255,0.15);">🔍</span>
      第二步：确认列映射
    </div>
    <div id="mapping-content"></div>
  </div>

  <div class="card hidden" id="step-template">
    <div class="card-title">
      <span class="icon" style="background:rgba(0,184,148,0.15);">🎯</span>
      第三步：选择目标模版
    </div>
    <div id="template-content"></div>
  </div>

  <div class="card hidden" id="step-export">
    <div class="card-title">
      <span class="icon" style="background:rgba(253,203,110,0.15);">📊</span>
      第四步：预览 & 导出
    </div>
    <div id="export-content"></div>
  </div>
</div>

<script>
// ==================== State ====================
const state = {
  sources: [],
  previewSourceId: '',
  pendingFiles: 0,
  accumFileCount: 0,
  mappingState: null,
  targetTemplate: null,
  customFields: [],
  outputRows: null,
  outputHeaders: null,
  // Template file data (ArrayBuffer) for preservation-based export
  templateFiles: {},
};

// ==================== Column Keywords ====================
const COL_KEYWORDS = {
  name:     /姓名|户名|名称|人员|收款人|员工|name|person/i,
  idCard:   /身份证|身份证号|身份证号码|id\s*card|idcard|证件号/i,
  phone:    /电话|phone|手机|mobile|联系电话/i,
  bankName: /开户行|开户银行|银行名称|bank\s*name/i,
  bankCard: /银行|bank|卡号|bankcard|账号|账户|个人银行卡号/i,
  amount:   /金额|amount|收入|income|报酬|pay|税前金额|税前收入|税后收入|应发金额|实发金额|计划发放收入|发放金额|付款金额|应发金额\(含税\)|应发金额（含税）/i,
  gender:   /性别|gender|sex/i,
  location: /开户地|开户所属地|银行所属地|税源地/i,
  note:     /备注|note|说明|remark/i,
};

const COL_TYPE_LABELS = {
  '':         '— 不识别 —',
  name:       '👤 姓名',
  idCard:     '🪪 身份证',
  phone:      '📱 手机号',
  bankName:   '🏦 开户银行',
  bankCard:   '💳 银行卡号',
  amount:     '💰 税前金额',
  gender:     '⚧ 性别',
  location:   '📍 开户地/税源地',
  note:       '📝 备注',
};

// ==================== Target Templates ====================
const TEMPLATES = {
  yidao: {
    name: '移步到岗',
    icon: '🚀',
    desc: '简洁模版，6列核心信息（保留模版结构）',
    headers: ['姓名', '身份证', '手机号', '开户银行', '银行卡号', '税前金额'],
    fieldMap: { name: '姓名', idCard: '身份证', phone: '手机号', bankName: '开户银行', bankCard: '银行卡号', amount: '税前金额' },
  },
  shenbianyun: {
    name: '身边云',
    icon: '☁️',
    desc: '付款模版（保留说明行、批次信息行和表头）',
    headers: ['商户订单号（非必填）', '收款人姓名（必填）', '身份证号（必填）', '个人银行卡号（必填）', '付款金额（元，必填）', '手机号（必填）', '备注（非必填）'],
    fieldMap: { name: '收款人姓名（必填）', idCard: '身份证号（必填）', bankCard: '个人银行卡号（必填）', amount: '付款金额（元，必填）', phone: '手机号（必填）', note: '备注（非必填）' },
  },
  youyi: {
    name: '云杉公司',
    icon: '🤝',
    desc: '详细模版（保留配置表和任务清单）',
    headers: ['出错信息', '平台', '商社编号', '姓名', '身份证号码', '性别', '任务清单', '税源地', '工种', '手机号码', '账号', '银行名称', '银行所属地', '税前金额', '个税金额', '商业保险', '备注'],
    fieldMap: { name: '姓名', idCard: '身份证号码', gender: '性别', phone: '手机号码', bankCard: '账号', bankName: '银行名称', location: '银行所属地', amount: '税前金额', note: '备注' },
  },
  custom: {
    name: '自定义模版',
    icon: '✏️',
    desc: '自由定义列名和顺序',
    headers: [],
    fieldMap: {},
  },
};

// ==================== File Upload ====================
const uploadArea = document.getElementById('upload-area');
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault(); uploadArea.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

function handleFileInput(e) { if (e.target.files.length) handleFiles(e.target.files); }

function handleFiles(fileList) {
  const files = Array.from(fileList);
  state.pendingFiles += files.length;
  state.accumFileCount += files.length;
  files.forEach(f => processFile(f));
}

function processFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'csv') {
    const reader = new FileReader();
    reader.onload = e => {
      let text = e.target.result;
      if (isGarbled(text)) {
        const r2 = new FileReader();
        r2.onload = e2 => {
          state.sources.push(buildSourceItem({ type: 'csv', fileName: file.name, rows: parseCSV(e2.target.result) }));
          onFileParsed();
        };
        r2.readAsText(file, 'gbk');
      } else {
        state.sources.push(buildSourceItem({ type: 'csv', fileName: file.name, rows: parseCSV(text) }));
        onFileParsed();
      }
    };
    reader.readAsText(file, 'utf-8');
  } else if (['xlsx', 'xls'].includes(ext)) {
    const reader = new FileReader();
    reader.onload = e => {
      const data = e.target.result;
      const wb = XLSX.read(data, { type: 'array' });
      const sheetItems = analyzeWorkbookSheets(wb, file.name);
      sheetItems.forEach(item => state.sources.push(item));
      // Store raw ArrayBuffer for template-based export
      state.templateFiles[file.name] = data;
      onFileParsed();
    };
    reader.readAsArrayBuffer(file);
  } else {
    alert('不支持的文件格式');
    state.pendingFiles--;
  }
}

function onFileParsed() {
  state.pendingFiles--;
  if (state.pendingFiles <= 0) {
    updateAccumIndicator();
    showMappingStep();
    document.getElementById('file-input').value = '';
  }
}

function buildSourceItem({ type, fileName, sheetName = '', rows = [], selected = true, analysis = null }) {
  return {
    id: `${type}:${fileName}:${sheetName || 'default'}:${Math.random().toString(36).slice(2, 8)}`,
    type, fileName, sheetName, rows, selected, analysis
  };
}

function updateAccumIndicator() {
  const el = document.getElementById('accum-indicator');
  const sel = state.sources.filter(s => s.selected);
  if (state.accumFileCount > 0) {
    el.classList.remove('hidden');
    el.innerHTML = `
      <div class="accum-bar">
        <span>📂 已累加 ${state.accumFileCount} 个文件（${sel.length} 个数据表，${countSelectedRows()} 行数据）</span>
        <button class="btn btn-secondary btn-sm" onclick="resetAll()">🗑️ 清空</button>
      </div>`;
  } else { el.classList.add('hidden'); }
}

function countSelectedRows() {
  return state.sources.filter(s => s.selected).reduce((sum, s) => sum + s.rows.length, 0);
}

// ==================== CSV ====================
function parseCSV(text) {
  return text.split(/\r?\n/).map(line => {
    const r = []; let cur = ''; let q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') q = !q;
      else if (ch === ',' && !q) { r.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    r.push(cur.trim());
    return r;
  }).filter(row => row.some(cell => cell !== ''));
}

function isGarbled(text) {
  if (/[\uFFFD]{2,}/.test(text)) return true;
  let s = 0;
  for (let i = 0; i < Math.min(text.length, 500); i++) {
    const c = text.charCodeAt(i);
    if (c > 255 && !(c >= 0x4E00 && c <= 0x9FFF) && !(c >= 0x3000 && c <= 0x303F)) s++;
  }
  return s > 10;
}

// ==================== Excel Analysis ====================
function analyzeWorkbookSheets(wb, fileName) {
  let monthHint = '', yearHint = '';
  for (const sn of wb.SheetNames) {
    const ws = wb.Sheets[sn];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false }).slice(0, 20);
    for (const row of rows) {
      for (const cell of row || []) {
        const t = String(cell || '').trim();
        if (!t) continue;
        if (!yearHint) { const m = t.match(/(20\d{2})/); if (m) yearHint = m[1]; }
        if (!monthHint) {
          const m2 = t.match(/(?:^|[^\d])(20\d{2}\s*年\s*\d{1,2}\s*月)/) || t.match(/(?:^|[^\d])(20\d{2}[-\/.]\d{1,2})/);
          if (m2) monthHint = m2[1];
        }
      }
    }
  }

  const analyzed = wb.SheetNames.map(sn => {
    const ws = wb.Sheets[sn];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false });
    return analyzeSheet(sn, rows, monthHint, yearHint);
  }).filter(item => item.rows.length > 0);

  if (!analyzed.length) return [];
  analyzed.sort((a, b) => b.score - a.score);
  const topScore = analyzed[0].score;
  let selected = analyzed.filter(item =>
    item.score >= 30 && item.dataRowsCount >= 1 && item.score >= topScore - 15 &&
    !/(汇总|总表|说明|模板|图表|透视|summary|chart|cover|封面|配置表|任务清单)/i.test(item.sheetName)
  );
  if (!selected.length) selected = [analyzed[0]];
  const selNames = new Set(selected.map(item => item.sheetName));

  return analyzed.map(item => buildSourceItem({
    type: 'excel-sheet', fileName, sheetName: item.sheetName,
    rows: item.rows, selected: selNames.has(item.sheetName), analysis: item
  }));
}

function analyzeSheet(sheetName, rows, monthHint, yearHint) {
  const nonEmpty = (rows || []).filter(row => row.some(cell => String(cell || '').trim() !== ''));
  if (!nonEmpty.length) return { sheetName, rows: [], score: -999, dataRowsCount: 0, headerRowIndex: 0, autoMap: { cols: {} } };

  const { headerRow, headerRowIndex, dataRows } = smartDetectTable(nonEmpty);
  const autoMap = detectColumnMapping(headerRow, dataRows);

  let headerScore = 0;
  Object.values(autoMap.cols || {}).forEach(col => {
    if (col.type === 'amount') headerScore += 25;
    else if (col.type === 'name') headerScore += 20;
    else if (col.type) headerScore += 10;
  });

  const reverseMap = {};
  Object.entries(autoMap.cols || {}).forEach(([ci, col]) => {
    if (col.type && reverseMap[col.type] == null) reverseMap[col.type] = Number(ci);
  });
  autoMap.amountCol = reverseMap.amount;
  autoMap.nameCol = reverseMap.name;

  let dataScore = 0;
  const sample = dataRows.slice(0, 50);
  if (sample.length >= 3) dataScore += 8;
  let amtHits = 0, idHits = 0;
  sample.forEach(row => {
    if (autoMap.amountCol != null && isAmountLikeNumber(row?.[autoMap.amountCol])) amtHits++;
    if (autoMap.nameCol != null && String(row?.[autoMap.nameCol] || '').trim()) idHits++;
  });
  dataScore += Math.round((amtHits / Math.max(sample.length, 1)) * 18);
  dataScore += Math.round((idHits / Math.max(sample.length, 1)) * 12);

  let nameScore = 0;
  if (/(费用明细|工资|报酬|劳务|发放|明细)/i.test(sheetName)) nameScore += 8;
  if (/(汇总|总表|配置|任务)/i.test(sheetName)) nameScore -= 12;

  return {
    sheetName, rows: nonEmpty, score: headerScore + dataScore + nameScore,
    dataRowsCount: dataRows.length, headerRowIndex, autoMap
  };
}

// ==================== Smart Table Detection (IMPROVED) ====================
const SUMMARY_RE = /合计|总计|汇总|小计|平台服务费|服务费率|平台费率|合计支付|开票金额|收费通知/i;

function smartDetectTable(rows) {
  const HEADER_RE = /月份|month|收入|income|金额|amount|姓名|name|身份证|电话|phone|手机|银行|bank|卡号|性别|gender|开户|账号|备注|note|出错|平台|商社|任务|税源|工种|付款|收款|商户|订单|发放|应发|实发|户名/i;
  let bestIdx = 0, bestScore = 0;
  const scanEnd = Math.min(rows.length, 30);

  for (let i = 0; i < scanEnd; i++) {
    const row = rows[i] || [];
    let score = 0;
    row.forEach(cell => {
      const v = String(cell || '');
      if (!v.trim()) return;
      Object.values(COL_KEYWORDS).forEach(re => { if (re.test(v)) score++; });
      if (/序号|编号|^#$/.test(v)) score += 0.5;
    });
    if (score > bestScore) { bestScore = score; bestIdx = i; }
  }

  const headerRow = rows[bestIdx] || [];
  const dataRows = [];
  for (let i = bestIdx + 1; i < rows.length; i++) {
    const row = rows[i] || [];
    // Skip empty rows
    if (!row.some(c => c != null && String(c).trim() !== '')) continue;
    // Skip summary rows (check ALL cells)
    if (isSummaryLikeRow(row)) continue;
    // Skip rows with too many header-like keywords (secondary headers)
    const kw = row.filter(cell => HEADER_RE.test(String(cell || ''))).length;
    if (kw >= 3) continue;
    // REQUIRE: row must contain at least one identity field (name, ID, phone, bank card)
    // This replaces the strict "first cell must be sequence number" check,
    // allowing data in any column layout (e.g. seq# in col B, text in col A)
    if (!hasIdentityField(row)) continue;
    dataRows.push(row);
  }
  return { headerRow, headerRowIndex: bestIdx, dataRows };
}

function isSummaryLikeRow(row) {
  if (!Array.isArray(row)) return false;
  // Check ALL cells for summary keywords
  return row.some(cell => SUMMARY_RE.test(String(cell || '')));
}

/**
 * Check if a row contains at least one identity field.
 * Supports: Chinese name (2-4 chars, excluding summary terms), ID card (18 digits),
 * phone (11 digits starting with 1), bank card (16-19 digits), or sequence number.
 */
const SUMMARY_TERMS = /累计|总计|合计|小计|收入|金额|税率|费率|支付|平台|到手|服务|保险|备注|说明|税源|工种|任务|性别|开户|发放|实发|应发|个税/;
function hasIdentityField(row) {
  let identityCount = 0;
  for (const cell of row) {
    const s = String(cell || '').trim();
    if (!s) continue;
    // Chinese name: 2-4 Chinese characters, exclude summary-like terms
    if (s.length >= 2 && s.length <= 4 && /^[\u4e00-\u9fff]+$/.test(s) && !SUMMARY_TERMS.test(s)) {
      identityCount += 2; // Strong signal
    }
    // ID card: 18 digits (last may be X)
    else if (/^\d{17}[\dXx]$/.test(s)) { identityCount += 2; }
    // Phone: 11 digits starting with 1
    else if (/^1[3-9]\d{9}$/.test(s)) { identityCount += 2; }
    // Bank card: 16-19 pure digits
    else if (/^\d{16,19}$/.test(s)) { identityCount += 2; }
    // Sequence number: 1-4 digit number (weak signal, needs supplement)
    else if (/^\d{1,4}$/.test(s) && parseInt(s) > 0 && parseInt(s) < 10000) { identityCount += 1; }
  }
  // Require at least 2 (one strong identity field, or two sequence numbers)
  return identityCount >= 2;
}

function detectColumnMapping(headerRow, dataRows) {
  const mapping = {};
  const used = new Set();

  headerRow.forEach((cell, i) => {
    const v = String(cell || '').trim();
    if (!v) return;
    for (const [type, re] of Object.entries(COL_KEYWORDS)) {
      if (type === 'amount') continue;
      if (!used.has(type) && re.test(v)) { mapping[i] = type; used.add(type); break; }
    }
  });

  let bestIdx = null, bestScore = -Infinity;
  headerRow.forEach((cell, i) => {
    if (mapping[i]) return;
    const s = getAmountColumnScore(cell, dataRows, i);
    if (s > bestScore) { bestScore = s; bestIdx = i; }
  });
  if (bestIdx != null && bestScore >= 5) { mapping[bestIdx] = 'amount'; used.add('amount'); }

  if (!used.has('amount')) {
    for (let ci = 0; ci < headerRow.length; ci++) {
      if (mapping[ci]) continue;
      let n = 0;
      for (let ri = 0; ri < Math.min(dataRows.length, 10); ri++) {
        if (isAmountLikeNumber(dataRows[ri]?.[ci])) n++;
      }
      if (n >= Math.min(dataRows.length, 10) * 0.5) { mapping[ci] = 'amount'; used.add('amount'); break; }
    }
  }

  const cols = {};
  headerRow.forEach((cell, i) => {
    const v = String(cell || '').trim();
    if (!v && mapping[i] == null) return;
    const samples = [];
    for (let ri = 0; ri < Math.min(dataRows.length, 3); ri++) {
      const sv = dataRows[ri]?.[i];
      if (sv != null && String(sv).trim()) samples.push(String(sv).trim());
    }
    cols[i] = { header: v || `列${i+1}`, type: mapping[i] || '', samples };
  });
  return { cols };
}

function getAmountColumnScore(header, dataRows, ci) {
  const h = String(header || '').trim();
  if (!h || /方式|类型|选择|状态|税源地|开户|账号|账户|手机号|电话|身份证|证件|银行|备注|说明|业务/.test(h)) return -Infinity;
  let score = 0;
  if (/税前金额|税前收入|计划发放收入|应发金额|实发金额|客户支付合计|付款金额|应发金额/i.test(h)) score += 9;
  else if (/金额|amount|收入额|合计金额|应付金额/i.test(h)) score += 6;
  const sample = dataRows.slice(0, 12);
  if (!sample.length) return score;
  let hits = 0;
  sample.forEach(row => { if (isAmountLikeNumber(row?.[ci])) hits++; });
  const ratio = hits / sample.length;
  score += ratio * 8;
  if (ratio < 0.35) score -= 8;
  return score;
}

function isAmountLikeNumber(value) {
  const raw = String(value == null ? '' : value).trim();
  if (!raw) return false;
  const compact = raw.replace(/,/g, '');
  if (/^\d{11}$/.test(compact) || /^\d{16,19}$/.test(compact) || /^\d{17}[\dXx]$/.test(compact)) return false;
  const num = parseFloat(compact);
  return !isNaN(num) && isFinite(num) && num > 0 && num < 1e8;
}

    </div>`;
  }

        ${Object.entries(COL_TYPE_LABELS).map(([k,v])=>`<option value="${k}" ${k===col.type?'selected':''}>${v}</option>`).join('')}
      </select>
      <div class="col-sample">${col.samples.map(s=>`<span>${s.length>15?s.slice(0,15)+'…':s}</span>`).join(' ')}</div>
    </div>`;
  });

  // Preview
  const pv = Math.min(dataRows.length, 5);
  let pvBody = '';
  for (let ri = 0; ri < pv; ri++) {
    pvBody += '<tr>' + colIndices.map(ci => {
      const v = String((dataRows[ri]||[])[ci]||'');
      return `<td>${v||'<span style="color:var(--text2);opacity:0.4;">—</span>'}</td>`;
    }).join('') + '</tr>';
  }
  if (dataRows.length > pv) pvBody += `<tr><td colspan="${colIndices.length}" style="text-align:center;color:var(--text2);font-size:12px;padding:8px;">… 还有 ${dataRows.length-pv} 行</td></tr>`;

  container.innerHTML = `
    ${sourceHTML}
    <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
      <div style="background:var(--surface2);padding:8px 14px;border-radius:8px;font-size:13px;">📊 <strong style="color:var(--accent2);">${dataRows.length}</strong> 行有效数据</div>
      <div style="background:var(--surface2);padding:8px 14px;border-radius:8px;font-size:13px;">📋 识别 <strong style="color:var(--accent2);">${colIndices.length}</strong> 列</div>
      ${headerRowIndex>0?`<div style="background:var(--surface2);padding:8px 14px;border-radius:8px;font-size:13px;">⏭️ 跳过前 ${headerRowIndex} 行</div>`:''}
    </div>
    <div style="font-size:14px;font-weight:600;margin-bottom:10px;">📋 列映射 — 请确认或修改</div>
    <div class="mapping-grid">${colsHTML}</div>
    <div style="margin-bottom:12px;">

          <thead><tr>${colIndices.map(ci=>`<th>${autoMap.cols[ci].header}</th>`).join('')}</tr></thead>
          <tbody>${pvBody}</tbody>
        </table>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" style="flex:1;padding:12px;font-size:15px;" onclick="confirmMapping()">✅ 确认映射</button>

function toggleSrc(id, checked) {
  const t = state.sources.find(s=>s.id===id);
  if (t) t.selected = checked;
  if (checked) state.previewSourceId = id;
  updateAccumIndicator(); showMappingStep();
}

function setPreview(id) {
  const t = state.sources.find(s=>s.id===id);
  if (t) { if (!t.selected) t.selected = true; state.previewSourceId = id; }
  updateAccumIndicator(); showMappingStep();
}

function onMapChange(sel) {
  const ci = sel.dataset.col;
  if (state.mappingState) state.mappingState.mapping.cols[ci].type = sel.value;
  sel.parentElement.classList.toggle('selected', !!sel.value);
}

function confirmMapping() {
  // Collect data rows WITH per-source column mappings
  // This is critical for multi-sheet files where each sheet has different column layout
  const sourcesData = [];
  state.sources.filter(s => s.selected).forEach(src => {
    const { dataRows } = smartDetectTable(src.rows);
    if (dataRows.length === 0) return;

    // Use user-modified mapping for preview source, auto-detected for others
    let typeToCol = {};
    if (src.id === state.previewSourceId) {
      const cols = state.mappingState.mapping.cols;
      Object.entries(cols).forEach(([ci, col]) => { if (col.type) typeToCol[col.type] = Number(ci); });
    } else if (src.analysis?.autoMap?.cols) {
      Object.entries(src.analysis.autoMap.cols).forEach(([ci, col]) => { if (col.type) typeToCol[col.type] = Number(ci); });
    }

    sourcesData.push({ dataRows, typeToCol });
  });

  if (!sourcesData.length) { alert('没有有效数据行'); return; }
  state.mappingState.sourcesData = sourcesData;
  showTemplateStep();
}

// ==================== Template Selection ====================
function showTemplateStep() {
  const container = document.getElementById('template-content');
  document.getElementById('step-template').classList.remove('hidden');

  let cardsHTML = '';
  for (const [key, tpl] of Object.entries(TEMPLATES)) {
    cardsHTML += `<div class="template-card ${state.targetTemplate===key?'selected':''}" onclick="selectTemplate('${key}')">
      <div class="name">${tpl.icon} ${tpl.name}</div>
      <div class="fields">${tpl.desc}</div>
      ${key!=='custom'?`<div style="margin-top:8px;font-size:11px;color:var(--text2);">${tpl.headers.slice(0,6).join('、')}${tpl.headers.length>6?'…':''}</div>`:''}
    </div>`;
  }

  let customHTML = '';
  if (state.targetTemplate === 'custom') {
    const tags = state.customFields.map((f,i)=>`<div class="custom-field-tag">${f} <span class="remove" onclick="rmCF(${i})">✕</span></div>`).join('');
    customHTML = `<div style="background:var(--surface2);border-radius:8px;padding:14px;border:1px solid var(--border);margin-top:12px;">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;">自定义列名</div>

        <button class="btn btn-secondary btn-sm" onclick="addCF()">添加</button>
      </div>
      <div class="custom-fields">${tags}</div>
    </div>`;
  }

  container.innerHTML = `<div class="template-grid">${cardsHTML}</div>${customHTML}
    <div class="btn-row">
      <button class="btn btn-primary" style="flex:1;padding:12px;font-size:15px;" onclick="confirmTemplate()" ${!state.targetTemplate?'disabled':''}>${state.targetTemplate==='custom'?'✅ 映射自定义列':'✅ 生成转换结果'}</button>
      <button class="btn btn-secondary" onclick="goBack('step-template')">⬅️ 返回</button>
    </div>`;
}

function selectTemplate(key) { state.targetTemplate = key; showTemplateStep(); }
function addCF() {
  const input = document.getElementById('cf-input');
  const v = input.value.trim();
  if (v && !state.customFields.includes(v)) { state.customFields.push(v); input.value = ''; showTemplateStep(); }
}
function rmCF(i) { state.customFields.splice(i,1); showTemplateStep(); }
function goBack(id) { document.getElementById(id).classList.add('hidden'); }

function confirmTemplate() {
  if (!state.targetTemplate) { alert('请选择模版'); return; }
  if (state.targetTemplate === 'custom' && !state.customFields.length) { alert('请添加列名'); return; }
  generateOutput();
}

// ==================== Generate Output ====================
function generateOutput() {
  const { sourcesData } = state.mappingState;

  if (state.targetTemplate === 'custom') {
    // For custom template, use the preview source's mapping
    const previewData = sourcesData[0] || { typeToCol: {} };
    showCustomMappingUI(previewData.typeToCol, sourcesData.flatMap(s => s.dataRows));
    return;
  }

  const tpl = TEMPLATES[state.targetTemplate];

  // Generate output rows using per-source column mappings
  const outputRows = [];
  sourcesData.forEach(({ dataRows, typeToCol }) => {
    // Build source-type → dest-column mapping for this source
    const srcToDest = {};
    for (const [type, destName] of Object.entries(tpl.fieldMap)) {
      const destIdx = tpl.headers.indexOf(destName);
      if (destIdx >= 0 && typeToCol[type] != null) srcToDest[type] = destIdx;
    }

    dataRows.forEach(row => {
      const out = new Array(tpl.headers.length).fill('');
      for (const [type, destIdx] of Object.entries(srcToDest)) {
        let val = row[typeToCol[type]];
        if (type === 'amount') val = sanitizeAmount(val);
        out[destIdx] = val != null ? String(val).trim() : '';
      }
      outputRows.push(out);
    });
  });

  // 身边云: do NOT auto-fill merchant order number (leave empty per user request)

  state.outputRows = outputRows;
  state.outputHeaders = tpl.headers;
  showExportStep();
}

function showCustomMappingUI(typeToCol, allDataRows) {
  const container = document.getElementById('export-content');
  document.getElementById('step-export').classList.remove('hidden');

  let html = '<div style="font-size:14px;font-weight:600;margin-bottom:12px;">🔗 自定义列映射</div>';
  state.customFields.forEach((field, fi) => {
    const opts = ['<option value="">— 不映射 —</option>'];
    Object.keys(typeToCol).forEach(type => {
      opts.push(`<option value="${type}">${COL_TYPE_LABELS[type]||type}</option>`);
    });
    html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <div style="width:120px;font-size:13px;font-weight:600;">${field}</div>
      <select data-field="${fi}" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:13px;">${opts.join('')}</select>
    </div>`;
  });
  html += `<div class="btn-row"><button class="btn btn-primary" style="flex:1;padding:12px;font-size:15px;" onclick="genCustom()">✅ 生成</button></div>`;
  container.innerHTML = html;
}

function genCustom() {
  const { sourcesData } = state.mappingState;

  const fmap = {};
  document.querySelectorAll('#export-content select[data-field]').forEach(sel => {
    if (sel.value) fmap[sel.dataset.field] = sel.value;
  });

  state.outputHeaders = state.customFields;
  state.outputRows = [];
  sourcesData.forEach(({ dataRows, typeToCol }) => {
    dataRows.forEach(row => {
      const out = new Array(state.customFields.length).fill('');
      for (const [fi, type] of Object.entries(fmap)) {
        let val = row[typeToCol[type]];
        if (type === 'amount') val = sanitizeAmount(val);
        out[Number(fi)] = val != null ? String(val).trim() : '';
      }
      state.outputRows.push(out);
    });
  });
  showExportStep();
}

function sanitizeAmount(val) {
  if (val == null) return '';
  const n = parseFloat(String(val).trim().replace(/,/g, ''));
  return isNaN(n) ? '' : String(Math.round(n * 100) / 100);
}

// ==================== Export Step ====================
function showExportStep() {
  const container = document.getElementById('export-content');
  document.getElementById('step-export').classList.remove('hidden');

  const headers = state.outputHeaders;
  const rows = state.outputRows;
  const tplName = state.targetTemplate === 'custom' ? '自定义' : TEMPLATES[state.targetTemplate].name;

  const pv = Math.min(rows.length, 8);
  let headHTML = headers.map(h=>`<th>${h}</th>`).join('');
  let bodyHTML = '';
  for (let ri = 0; ri < pv; ri++) {
    bodyHTML += '<tr>' + rows[ri].map(c=>`<td>${c||'<span style="color:var(--text2);opacity:0.4;">—</span>'}</td>`).join('') + '</tr>';
  }
  if (rows.length > pv) bodyHTML += `<tr><td colspan="${headers.length}" style="text-align:center;color:var(--text2);font-size:12px;">… 还有 ${rows.length-pv} 行</td></tr>`;

  container.innerHTML = `
    <div class="status-msg success">✅ 转换完成 — ${tplName}（${rows.length} 行）</div>
    <div style="overflow-x:auto;border:1px solid var(--border);border-radius:8px;margin-bottom:16px;">
      <table class="result-table"><thead><tr>${headHTML}</tr></thead><tbody>${bodyHTML}</tbody></table>
    </div>
    <div class="btn-row">
      <button class="btn btn-green" style="flex:1;padding:12px;font-size:15px;" onclick="exportExcel()">📥 导出 Excel</button>
      <button class="btn btn-secondary" onclick="exportCSV()">📥 导出 CSV</button>
      <button class="btn btn-secondary" onclick="goBack('step-export')">⬅️ 返回</button>
    </div>`;
}

// ==================== Excel Export (Template-Preserving) ====================
function exportExcel() {
  const headers = state.outputHeaders;
  const rows = state.outputRows;
  const tplName = state.targetTemplate === 'custom' ? '自定义模版' : TEMPLATES[state.targetTemplate].name;

  if (state.targetTemplate === 'yidao') {
    exportYidao(headers, rows, tplName);
  } else if (state.targetTemplate === 'shenbianyun') {
    exportShenbianyun(headers, rows, tplName);
  } else if (state.targetTemplate === 'youyi') {
    exportYouyi(headers, rows, tplName);
  } else {
    exportGeneric(headers, rows, tplName);
  }
}

// 移步到岗: 1 header row + data rows
function exportYidao(headers, rows, tplName) {
  const wsData = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = headers.map((h, i) => {
    let max = h.length;
    rows.forEach(r => { const l = String(r[i]||'').length; if (l > max) max = l; });
    return { wch: Math.min(max + 2, 30) };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '智能模板');
  XLSX.writeFile(wb, `${tplName}_转换结果.xlsx`);
}

// 身边云: Row1=instructions(merged), Row2=batch info, Row3=empty, Row4=header, Row5+=data
function exportShenbianyun(headers, rows, tplName) {
  const wsData = [

// 云杉公司: Keep header+sample, data starts row 3, preserve 配置表 and 任务清单
function exportYouyi(headers, rows, tplName) {
  // Load original template to preserve structure

    const ws = wb.Sheets['费用明细'];
    // Get existing data range
    const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
    // Find the last row with actual data (skip empty rows after header)
    let lastDataRow = 1; // 0-indexed, row 1 = Excel row 2
    for (let r = range.s.r + 1; r <= range.e.r; r++) {
      const cell = ws[XLSX.utils.encode_cell({r, c: 0})];
      if (cell && cell.v != null && String(cell.v).trim()) lastDataRow = r;
    }
    // Clear rows after header (row 0 = header, row 1 = sample, clear from row 1)
    for (let r = 1; r <= range.e.r; r++) {
      for (let c = range.s.c; c <= range.e.c; c++) {
        const addr = XLSX.utils.encode_cell({r, c});
        if (ws[addr]) delete ws[addr];
      }
    }
    // Write new data starting from row 1 (0-indexed)
    rows.forEach((row, ri) => {
      row.forEach((val, ci) => {
        if (val) ws[XLSX.utils.encode_cell({r: ri + 1, c: ci})] = { t: 's', v: val };
      });
    });
    // Update range
    const newEndRow = rows.length;
    const newEndCol = headers.length - 1;
    ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:newEndRow, c:newEndCol}});
  } else {
    // No template file, generate from scratch
    const wsData = [headers, ...rows];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '费用明细');
    // Add empty config sheets
    const cfg = XLSX.utils.aoa_to_sheet([['税源地','平台']]);
    XLSX.utils.book_append_sheet(wb, cfg, '配置表');
    const task = XLSX.utils.aoa_to_sheet([['任务清单']]);
    XLSX.utils.book_append_sheet(wb, task, '任务清单');
  }
  XLSX.writeFile(wb, `${tplName}_转换结果.xlsx`);
}

// Generic: just headers + data
function exportGeneric(headers, rows, tplName) {
  const wsData = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = headers.map((h, i) => {
    let max = h.length;
    rows.forEach(r => { const l = String(r[i]||'').length; if (l > max) max = l; });
    return { wch: Math.min(max + 2, 30) };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, tplName);
  XLSX.writeFile(wb, `${tplName}_转换结果.xlsx`);
}

function exportCSV() {
  const BOM = '\uFEFF';
  const csv = [state.outputHeaders, ...state.outputRows].map(row =>
    row.map(cell => {
      const s = String(cell || '');
      return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',')
  ).join('\n');
  const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${state.targetTemplate==='custom'?'自定义':TEMPLATES[state.targetTemplate].name}_转换结果.csv`;
  a.click();
}

// ==================== Reset ====================
function resetAll() {
  Object.assign(state, {
    sources: [], previewSourceId: '', pendingFiles: 0, accumFileCount: 0,
    mappingState: null, targetTemplate: null, customFields: [],
    outputRows: null, outputHeaders: null, templateFiles: {},
  });
  ['accum-indicator','step-mapping','step-template','step-export'].forEach(id =>
    document.getElementById(id).classList.add('hidden'));
  document.getElementById('file-input').value = '';
}
